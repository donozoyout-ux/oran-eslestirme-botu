services:
  - type: web
    name: oran-eslestirme-botu
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ODDS_PROVIDER
        value: betexplorer_scraper
      - key: SPORT_KEYS
        value: soccer_epl,soccer_uefa_champs_league
      - key: BOOKMAKER_KEYS
        value: pinnacle,betfair_ex_eu,betfair,bet365
      - key: REGIONS
        value: eu,uk
      - key: ODDS_TOLERANCE_PERCENT
        value: "2"
      - key: POLL_INTERVAL_SECONDS
        value: "180"
      - key: SCRAPER_MAX_MATCHES
        value: "2"
      - key: SCRAPER_PAGE_TIMEOUT_MS
        value: "60000"
      - key: SCRAPER_WAIT_MS
        value: "2500"
      - key: SCRAPER_ALLOW_VISIBLE_BOOKMAKER_FALLBACK
        value: "true"
      - key: PREMATCH_TRACK_HOURS
        value: "6"
      - key: PREMATCH_FAR_POLL_MINUTES
        value: "60"
      - key: PREMATCH_NEAR_POLL_MINUTES
        value: "15"
      - key: PREMATCH_FINAL_POLL_MINUTES
        value: "5"
      - key: LIVE_POLL_MINUTES
        value: "3"
      - key: MAX_QUOTE_AGE_SECONDS
        value: "300"
      - key: MAX_LIVE_EVENT_AGE_MINUTES
        value: "180"
      - key: ALERT_COOLDOWN_SECONDS
        value: "600"
      - key: SURPRISE_ODDS_THRESHOLD
        value: "2.5"
      - key: ODDS_MOVEMENT_THRESHOLD_PERCENT
        value: "8"
      - key: GOOGLE_SHEETS_SYNC_MINUTES
        value: "15"
      - key: DRY_RUN
        value: "true"
      - key: ODDS_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: GOOGLE_SHEETS_SPREADSHEET_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: GOOGLE_PRIVATE_KEY
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
